version: 2

models:
  - name: dim_store
    description: "Dimension table for store."
    columns:
      - name: store_number
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
    data_tests:     
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cast(store_number as int64) > 0 "
          config:
            severity: warn # accepts only `error` and `warn` default is error
  - name: dim_item
    description: "Dimension table for item."
    columns:
      - name: item_number
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
      - name: bottle_volume_ml
        description: "bottle_volume_ml should not be null"
        tests: 
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cast(item_number as int64) > 0 "
          config:
            severity: warn # accepts only `error` and `warn` default is error
  